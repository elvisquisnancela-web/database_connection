<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">

<title>Pole Assistant</title>

<style>

body{
    margin:0;
    font-family:Segoe UI;
    background:#f5f7fa;
}

.header{
    background:#0078d4;
    color:white;
    padding:20px;
    font-size:24px;
    font-weight:bold;
}

.container{
    width:900px;
    margin:20px auto;
}

.message{
    background:white;
    border-radius:10px;
    padding:15px;
    margin-bottom:15px;
    box-shadow:0 1px 4px rgba(0,0,0,.1);
}

.user{
    border-left:5px solid #0078d4;
}

.bot{
    border-left:5px solid #28a745;
}

.loading {
    color:#666;
    font-style:italic;
}

.typing::after {
    content:"";
    animation:dots 1.5s infinite;
}

@keyframes dots {

    0% { content:""; }

    25% { content:"."; }

    50% { content:".."; }

    75% { content:"..."; }

    100% { content:""; }
}

textarea{
    width:100%;
    height:80px;
    border:1px solid #ccc;
    border-radius:8px;
    padding:10px;
}

button{
    margin-top:10px;
    background:#0078d4;
    color:white;
    border:none;
    padding:10px 20px;
    border-radius:8px;
    cursor:pointer;
}

button:hover{
    background:#005ea6;
}

pre{
    background:#f0f0f0;
    padding:10px;
    overflow:auto;
}

details{
    margin-top:10px;
}

.status{
    color:#666;
    font-size:12px;
    margin-top:10px;
}

</style>

</head>

<body>

<div class="header">
Pole Assistant
</div>

<div class="container">

<div id="chat"></div>

<textarea
id="question"
placeholder="Ask a question..."
></textarea>

<button onclick="askQuestion()">
Ask
</button>

</div>

<script>

async function askQuestion() {

    const question =
        document.getElementById("question").value;

    if(!question)
        return;

    const chat =
        document.getElementById("chat");

    chat.innerHTML += `
        <div class="message user">
            <strong>You</strong><br><br>
            ${question}
        </div>
    `;

    chat.innerHTML += `
        <div class="message bot loading" id="loading">
            <strong>Pole Assistant</strong><br><br>
            <span class="typing">
            🤖 Thinking
            </span>
        </div>
    `; 

    document.getElementById(
        "question"
    ).value = "";

    try {
        const startTime = Date.now();
        const response =
            await fetch(
              "/query2?question=" +
              encodeURIComponent(question)
            );

        const data =
            await response.json();

        const elapsed =
            ((Date.now() - startTime) / 1000)
                .toFixed(2);
        
        document
            .getElementById("loading")
            ?.remove()

        chat.innerHTML += `
        <div class="message bot">

            <strong>Pole Assistant</strong>
            <br><br>

            ${data.answer}

            <div class="status">
                ✅ PostgreSQL Result Retrieved
                <br>
                ⏱ ${elapsed} sec
            </div>

            <details>

                <summary>
                  Technical Details
                </summary>

                <h4>Generated SQL</h4>

                <pre>${data.generated_sql}</pre>

                <h4>Returned Rows</h4>

                <pre>${JSON.stringify(
                    data.rows,
                    null,
                    2
                )}</pre>

            </details>

        </div>
        `;

        window.scrollTo(
            0,
            document.body.scrollHeight
        );

    }
    
    catch(error){

    document
        .getElementById("loading")
        ?.remove();

    chat.innerHTML += `
    <div class="message bot">

        <strong>Error</strong>
        <br><br>

        Unable to process request.

        <pre>${error}</pre>

    </div>
    `;
}
}

document
    .getElementById("question")
    .addEventListener(
        "keydown",
        function(e){

            if(
                e.key === "Enter" &&
                !e.shiftKey
            ){
                e.preventDefault();
                askQuestion();
            }
        }
    );

</script>

</body>
</html>
