name: Trigger auto deployment for containerappelvis

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/containerappelvis-AutoDeployTrigger-5bb47c4f-f3e8-40cf-a5bc-ec5c89dba258.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.CONTAINERAPPELVIS_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.CONTAINERAPPELVIS_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.CONTAINERAPPELVIS_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: 
          registryUsername: ${{ secrets.CONTAINERAPPELVIS_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.CONTAINERAPPELVIS_REGISTRY_PASSWORD }}
          containerAppName: containerappelvis
          resourceGroup: DefaultResourceGroup-ESC
          imageToBuild: default/[parameters('containerAppName')]:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


